<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Profilbygget – CV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#b84164}a:hover{color:#9c304f}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #fffafb; color: #4c303b; font-family: Inter, Arial, sans-serif">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 14px; border-bottom: 1px solid #f0d9e0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="#" aria-label="Tillbaka till profilen" style="display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; color: #4c303b; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span style="font-size: 13px; font-weight: 500; color: #7f616d">Steg 1 av 5</span>
      <span style="width: 44px"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
      <span style="height: 5px; border-radius: 999px; background: #b84164"></span>
      <span style="height: 5px; border-radius: 999px; background: #f4dce5"></span>
      <span style="height: 5px; border-radius: 999px; background: #f4dce5"></span>
      <span style="height: 5px; border-radius: 999px; background: #f4dce5"></span>
      <span style="height: 5px; border-radius: 999px; background: #f4dce5"></span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 140px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: -0.03em">Börja med ditt CV</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #7f616d">CV:t är grunden i din profil. Välj det sätt som passar dig.</p>
    </div>

    <div role="radiogroup" aria-label="Hur vill du skapa ditt CV?" style="display: flex; flex-direction: column; gap: 12px">
      <button type="button" role="radio" aria-checked="{{guidedChecked}}" onClick="{{pickGuided}}" style="{{guidedStyle}}">
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="{{guidedIcon}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg></span>
          <span style="padding: 5px 10px; border-radius: 999px; background: #ffffff; color: #b84164; font-size: 12px; font-weight: 600">Rekommenderat</span>
        </span>
        <span style="font-size: 17px; font-weight: 600">Skapa med guidat formulär</span>
        <span style="font-size: 14px; line-height: 1.5; color: #7f616d">Svara på några frågor så skriver AI:n ett CV som du granskar. Cirka 3–5 min.</span>
      </button>

      <button type="button" role="radio" aria-checked="{{uploadChecked}}" onClick="{{pickUpload}}" style="{{uploadStyle}}">
        <span style="{{uploadIcon}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span>
        <span style="font-size: 17px; font-weight: 600">Ladda upp ett CV</span>
        <span style="font-size: 14px; line-height: 1.5; color: #7f616d">Har du redan ett CV? PDF, max 5 MB.</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 20px; background: #fce9ef">
      <span style="font-size: 14px; font-weight: 600">Det här ingår</span>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b84164" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Erfarenhet, även från skola och fritid</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b84164" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Utbildning</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b84164" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Språk</span>
      </div>
    </div>

    <p style="display: flex; gap: 8px; margin: 0; font-size: 13px; line-height: 1.5; color: #7f616d">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Du granskar allt innan något sparas i din profil.
    </p>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 14px 20px 30px; border-top: 1px solid #f0d9e0; background: rgba(255, 250, 251, 0.96)">
    <a href="Main.dc.html" style="flex: 1; display: grid; place-items: center; min-height: 52px; border-radius: 16px; background: #b84164; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { method: 'guided' };
  }
  renderVals() {
    var self = this;
    var card = 'display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%; padding: 18px; border-radius: 22px; font: inherit; color: #4c303b; text-align: left; cursor: pointer; ';
    var on = 'border: 2px solid #b84164; background: #fff4f7;';
    var off = 'border: 1px solid #f0d9e0; background: #ffffff;';
    var icon = 'display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; ';
    var iconOn = 'background: #b84164; color: #ffffff;';
    var iconOff = 'background: #fce9ef; color: #b84164;';
    var g = this.state.method === 'guided';
    return {
      guidedChecked: g ? 'true' : 'false',
      uploadChecked: g ? 'false' : 'true',
      guidedStyle: card + (g ? on : off),
      uploadStyle: card + (g ? off : on),
      guidedIcon: icon + (g ? iconOn : iconOff),
      uploadIcon: icon + (g ? iconOff : iconOn),
      cta: g ? 'Starta formuläret' : 'Välj PDF',
      pickGuided: function () { self.setState({ method: 'guided' }); },
      pickUpload: function () { self.setState({ method: 'upload' }); }
    };
  }
}
</script>
</body>
</html>
