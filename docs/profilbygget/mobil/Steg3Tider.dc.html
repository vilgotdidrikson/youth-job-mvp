<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Profilbygget – När jag kan jobba</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#b84164}a:hover{color:#9c304f}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1300px; box-sizing: border-box; overflow: hidden; background: #fffafb; color: #4c303b; font-family: Inter, Arial, sans-serif">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 14px; border-bottom: 1px solid #f0d9e0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" aria-label="Föregående steg: Vad jag söker" style="display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; color: #4c303b; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span style="font-size: 13px; font-weight: 500; color: #7f616d">Steg 3 av 5</span>
      <span style="width: 44px"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
      <span style="height: 5px; border-radius: 999px; background: #b84164"></span>
      <span style="height: 5px; border-radius: 999px; background: #b84164"></span>
      <span style="height: 5px; border-radius: 999px; background: #b84164"></span>
      <span style="height: 5px; border-radius: 999px; background: #f4dce5"></span>
      <span style="height: 5px; border-radius: 999px; background: #f4dce5"></span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 24px 20px 140px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.15; letter-spacing: -0.03em">När kan du jobba?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #7f616d">Hjälp företag att se om arbetstiderna passar dig.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid #f0d9e0; border-radius: 22px; background: #ffffff">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 id="dagar" style="margin: 0; font-size: 17px; font-weight: 600">Vilka dagar?</h2>
        <div style="display: flex; gap: 6px">
          <button type="button" onClick="{{weekdays}}" style="min-height: 36px; padding: 0 10px; border: 1px solid #f0d9e0; border-radius: 999px; background: #ffffff; color: #b84164; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Vardagar</button>
          <button type="button" onClick="{{weekend}}" style="min-height: 36px; padding: 0 10px; border: 1px solid #f0d9e0; border-radius: 999px; background: #ffffff; color: #b84164; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Helger</button>
        </div>
      </div>
      <div role="group" aria-labelledby="dagar" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{d.pressed}}" aria-label="{{d.full}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.short}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid #f0d9e0; border-radius: 22px; background: #ffffff">
      <h2 id="tider" style="margin: 0; font-size: 17px; font-weight: 600">Vilka tider passar?</h2>
      <div role="group" aria-labelledby="tider" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{periods}}" as="p" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="{{p.style}}">
            <span style="{{p.iconWrap}}">
              <sc-if value="{{p.isDay}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
              <sc-if value="{{p.isEvening}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M6 18a6 6 0 0 1 12 0"/><path d="M12 6V3M5.6 9.6L4 8M18.4 9.6L20 8"/></svg></sc-if>
              <sc-if value="{{p.isNight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></sc-if>
              <sc-if value="{{p.isHoliday}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></sc-if>
            </span>
            <span style="font-size: 15px; font-weight: 600">{{p.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid #f0d9e0; border-radius: 22px; background: #ffffff">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span id="start" style="font-size: 15px; font-weight: 600">När kan du börja? <span style="font-weight: 400; color: #7f616d">(valfritt)</span></span>
        <div role="group" aria-labelledby="start" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #fce9ef">
          <button type="button" aria-pressed="{{asapPressed}}" onClick="{{pickAsap}}" style="{{asapStyle}}">Så snart som möjligt</button>
          <button type="button" aria-pressed="{{datePressed}}" onClick="{{pickDate}}" style="{{dateStyle}}">Välj datum</button>
        </div>
        <sc-if value="{{showDate}}" hint-placeholder-val="{{false}}">
          <input type="date" aria-label="Startdatum" value="2027-06-14" style="box-sizing: border-box; width: 100%; min-height: 50px; padding: 0 14px; border: 1px solid #f0d9e0; border-radius: 14px; background: #fffafb; color: #4c303b; font: inherit; font-size: 16px">
        </sc-if>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Timmar per vecka</span><span style="font-size: 13px; color: #7f616d">Ungefär. Valfritt.</span></span>
        <div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px; background: #fce9ef">
          <button type="button" aria-label="Färre timmar" onClick="{{less}}" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 11px; background: #ffffff; color: #4c303b; font: inherit; font-size: 20px; cursor: pointer">−</button>
          <span aria-live="polite" style="min-width: 44px; text-align: center; font-size: 18px; font-weight: 600">{{hours}}</span>
          <button type="button" aria-label="Fler timmar" onClick="{{more}}" style="display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 11px; background: #ffffff; color: #4c303b; font: inherit; font-size: 20px; cursor: pointer">+</button>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border: 1px solid #f0d9e0; border-radius: 22px; background: #ffffff">
      <label for="egna" style="font-size: 17px; font-weight: 600">Något mer om dina tider?</label>
      <textarea id="egna" rows="3" placeholder="Till exempel efter skolan från 16.30 eller varierande schema" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #f0d9e0; border-radius: 14px; background: #fffafb; color: #4c303b; font: inherit; font-size: 16px; line-height: 1.5; resize: vertical"></textarea>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 14px 20px 30px; border-top: 1px solid #f0d9e0; background: rgba(255, 250, 251, 0.96)">
    <a href="Steg4Kunskaper.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 14px; color: #7f616d; font-size: 15px; font-weight: 500; text-decoration: none">Hoppa över</a>
    <a href="Steg4Kunskaper.dc.html" style="flex: 1; display: grid; place-items: center; min-height: 52px; border-radius: 16px; background: #b84164; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none">Spara och fortsätt</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { days: ['sat', 'sun'], periods: ['day', 'holidays'], start: 'asap', hours: 10 };
  }
  toggle(key, id) {
    var cur = this.state[key];
    var next = cur.indexOf(id) !== -1 ? cur.filter(function (x) { return x !== id; }) : cur.concat([id]);
    var patch = {}; patch[key] = next; this.setState(patch);
  }
  renderVals() {
    var self = this;
    var dayList = [['mon', 'Mån', 'Måndag'], ['tue', 'Tis', 'Tisdag'], ['wed', 'Ons', 'Onsdag'], ['thu', 'Tor', 'Torsdag'], ['fri', 'Fre', 'Fredag'], ['sat', 'Lör', 'Lördag'], ['sun', 'Sön', 'Söndag']];
    var days = dayList.map(function (d) {
      var on = self.state.days.indexOf(d[0]) !== -1;
      return {
        short: d[1], full: d[2], pressed: on ? 'true' : 'false',
        style: 'height: 44px; padding: 0; border-radius: 14px; font: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'border: 1.5px solid #b84164; background: #b84164; color: #ffffff; font-weight: 600;' : 'border: 1px solid #f0d9e0; background: #ffffff; color: #4c303b; font-weight: 500;'),
        pick: function () { self.toggle('days', d[0]); }
      };
    });
    var periodList = [['day', 'Dagtid'], ['evening', 'Kväll'], ['night', 'Natt'], ['holidays', 'Skollov']];
    var periods = periodList.map(function (p) {
      var on = self.state.periods.indexOf(p[0]) !== -1;
      return {
        label: p[1], pressed: on ? 'true' : 'false',
        isDay: p[0] === 'day', isEvening: p[0] === 'evening', isNight: p[0] === 'night', isHoliday: p[0] === 'holidays',
        style: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; border-radius: 18px; font: inherit; color: #4c303b; text-align: left; cursor: pointer; ' + (on ? 'border: 2px solid #b84164; background: #fce9ef;' : 'border: 1px solid #f0d9e0; background: #ffffff;'),
        iconWrap: 'display: grid; place-items: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; ' + (on ? 'background: #b84164; color: #ffffff;' : 'background: #fce9ef; color: #b84164;'),
        pick: function () { self.toggle('periods', p[0]); }
      };
    });
    var seg = 'min-height: 44px; padding: 0 6px; border: 0; border-radius: 11px; font: inherit; font-size: 14px; cursor: pointer; ';
    var segOn = 'background: #ffffff; color: #4c303b; font-weight: 600; box-shadow: 0 2px 8px rgba(76, 48, 59, 0.12);';
    var segOff = 'background: transparent; color: #7f616d; font-weight: 500;';
    var asap = this.state.start === 'asap';
    return {
      days: days,
      periods: periods,
      weekdays: function () { self.setState({ days: ['mon', 'tue', 'wed', 'thu', 'fri'] }); },
      weekend: function () { self.setState({ days: ['sat', 'sun'] }); },
      asapPressed: asap ? 'true' : 'false',
      datePressed: asap ? 'false' : 'true',
      asapStyle: seg + (asap ? segOn : segOff),
      dateStyle: seg + (asap ? segOff : segOn),
      showDate: !asap,
      pickAsap: function () { self.setState({ start: 'asap' }); },
      pickDate: function () { self.setState({ start: 'date' }); },
      hours: this.state.hours,
      less: function () { self.setState({ hours: Math.max(0, self.state.hours - 1) }); },
      more: function () { self.setState({ hours: Math.min(60, self.state.hours + 1) }); }
    };
  }
}
</script>
</body>
</html>
